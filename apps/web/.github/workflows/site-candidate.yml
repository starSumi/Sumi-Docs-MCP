name: Site candidate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to build for human acceptance
        required: true
        type: string
      site_url:
        description: Public HTTPS origin used for canonical URLs
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: site-candidate-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require a full commit SHA
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          [[ "$REQUESTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]
          test "${REQUESTED_COMMIT,,}" = "$DISPATCH_SHA"

      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${REQUESTED_COMMIT,,}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Verify the release build
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: npm run verify:release

      - name: Package immutable static output
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          mkdir -p artifacts
          archive="artifacts/sumi-docs-web-${REQUESTED_COMMIT,,}.tar.gz"
          tar -czf "$archive" -C dist .
          sha256sum "$archive" > "${archive}.sha256"

      - name: Attest candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*

      - name: Upload candidate for human acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-candidate-${{ inputs.commit }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
