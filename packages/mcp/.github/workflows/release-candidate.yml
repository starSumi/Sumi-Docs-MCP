name: Release candidate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to build for human acceptance
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-candidate-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Require a full commit SHA
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          if ($env:REQUESTED_COMMIT -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'commit must be a full 40-character SHA.'
          }
          if ($env:REQUESTED_COMMIT.ToLowerInvariant() -ne $env:DISPATCH_SHA) {
            throw 'commit must equal the SHA selected as the workflow dispatch ref.'
          }

      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne $env:REQUESTED_COMMIT.ToLowerInvariant()) {
            throw "Checked out $actual instead of the requested commit."
          }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.5.0
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Run release checks
        run: npm run verify

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build and smoke test the source distribution
        run: npm run example:smoke

      - name: Build the Windows x64 executable
        run: npm run build:sea

      - name: Smoke test the executable
        run: node scripts/smoke-example.js --executable artifacts/bin/sumi-docs-mcp.exe

      - name: Record the performance gate
        id: benchmark
        continue-on-error: true
        shell: pwsh
        run: |
          node scripts/benchmark-cold-start.js --iterations 5 --executable artifacts/bin/sumi-docs-mcp.exe > artifacts/benchmark.json
          exit $LASTEXITCODE

      - name: Build immutable candidate assets
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        shell: pwsh
        run: |
          ./scripts/build-release-candidate.ps1 `
            -CommitSha $env:REQUESTED_COMMIT `
            -BenchmarkReport 'artifacts/benchmark.json'

      - name: Verify candidate checksums and identity
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          EXPECTED_TAG: v${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          node scripts/verify-release-candidate.mjs `
            --expected-commit $env:REQUESTED_COMMIT `
            --expected-tag $env:EXPECTED_TAG

      - name: Attest candidate provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/release/*

      - name: Bind the SBOM to installable assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/release/*.zip
            artifacts/release/*.tgz
          sbom-path: artifacts/release/sbom.cdx.json

      - name: Upload candidate for human acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ inputs.commit }}
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
