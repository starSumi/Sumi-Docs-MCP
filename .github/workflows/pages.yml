name: Documentation site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build verified Pages artifact
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the latest main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current" = "$GITHUB_SHA"

      - name: Check out deployment source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install the pinned package manager
        run: |
          npm install --global --ignore-scripts --registry https://registry.npmjs.org pnpm@10.26.0
          pnpm --version

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and verify site
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          pnpm run verify:contract
          pnpm --filter @sumi-os/docs-web verify:release
          pnpm run verify:integration

      - name: Confirm deployment source is still current
        id: freshness
        if: ${{ success() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current" = "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload verified Pages artifact
        if: ${{ success() && !cancelled() && steps.freshness.outputs.current == 'true' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/web/dist
          retention-days: 1

  deploy:
    name: Deploy current main
    if: ${{ github.ref == 'refs/heads/main' && success() && !cancelled() }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
