name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Release candidate workflow run ID accepted by a human
        required: true
        type: string
      tag:
        description: Existing annotated tag, for example v0.1.0
        required: true
        type: string
      confirmation:
        description: Type ACCEPTED to confirm manual testing passed
        required: true
        type: string
      performance_exception:
        description: NONE when passing, otherwise the approved repository issue URL
        required: true
        default: NONE
        type: string
      unsigned_binary_exception:
        description: Approved repository issue URL for the unsigned Windows binary
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare-draft:
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce the human acceptance input
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          ACCEPTANCE_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          test "$ACCEPTANCE_CONFIRMATION" = 'ACCEPTED'
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Check out the accepted tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.5.0

      - name: Verify annotated tag and package version
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = 'tag'
          commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v${version}"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Verify candidate workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          test "$(jq -r .conclusion <<<"$run_json")" = 'success'
          test "$(jq -r .event <<<"$run_json")" = 'workflow_dispatch'
          test "$(jq -r .path <<<"$run_json")" = '.github/workflows/release-candidate.yml'
          test "$(jq -r .head_sha <<<"$run_json")" = "$EXPECTED_COMMIT"

      - name: Download the accepted candidate without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ steps.identity.outputs.commit }}
          path: artifacts/release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify candidate identity and checksums
        env:
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          node scripts/verify-release-candidate.mjs \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-tag "$RELEASE_TAG"

      - name: Enforce the performance gate or a tracked exception
        env:
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_EXCEPTION: ${{ inputs.performance_exception }}
        shell: bash
        run: |
          passed="$(jq -r '.benchmark.passed' artifacts/release/RELEASE-MANIFEST.json)"
          if [[ "$passed" = 'true' ]]; then
            test "$PERFORMANCE_EXCEPTION" = 'NONE'
          else
            [[ "$PERFORMANCE_EXCEPTION" =~ ^https://github.com/${GITHUB_REPOSITORY}/issues/[0-9]+$ ]]
            issue_number="${PERFORMANCE_EXCEPTION##*/}"
            issue_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}")"
            test "$(jq -r .state <<<"$issue_json")" = 'open'
            test "$(jq -r 'has("pull_request")' <<<"$issue_json")" = 'false'
            test "$(jq -r 'any(.labels[]; .name == "release-exception-approved")' <<<"$issue_json")" = 'true'
          fi

      - name: Require approval for the unsigned Windows binary
        env:
          GH_TOKEN: ${{ github.token }}
          UNSIGNED_BINARY_EXCEPTION: ${{ inputs.unsigned_binary_exception }}
        shell: bash
        run: |
          test "$(jq -r '.codeSigning' artifacts/release/RELEASE-MANIFEST.json)" = 'unsigned'
          [[ "$UNSIGNED_BINARY_EXCEPTION" =~ ^https://github.com/${GITHUB_REPOSITORY}/issues/[0-9]+$ ]]
          issue_number="${UNSIGNED_BINARY_EXCEPTION##*/}"
          issue_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${issue_number}")"
          test "$(jq -r .state <<<"$issue_json")" = 'open'
          test "$(jq -r 'has("pull_request")' <<<"$issue_json")" = 'false'
          test "$(jq -r 'any(.labels[]; .name == "release-exception-approved")' <<<"$issue_json")" = 'true'

      - name: Verify GitHub artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for asset in artifacts/release/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            artifacts/release/* \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "Sumi-Docs-MCP ${RELEASE_TAG}"
