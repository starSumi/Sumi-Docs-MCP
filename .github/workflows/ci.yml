name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: Commit policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install the pinned package manager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10.26.0
          run_install: false

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate every new commit message
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" = 'pull_request' ]]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ -n "$EVENT_BEFORE" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            range="$EVENT_BEFORE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi

          message_file="$RUNNER_TEMP/commit-message.txt"
          git rev-list --reverse "$range" | while read -r commit; do
            git show -s --format=%B "$commit" > "$message_file"
            pnpm run commitlint -- --edit "$message_file"
            node packages/mcp/scripts/git-hooks/reject-agent-attribution.mjs "$message_file"
            node packages/mcp/scripts/git-hooks/reject-agent-identity.mjs --commit "$commit"
          done

  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install the pinned package manager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.1.0
        with:
          version: 10.26.0
          run_install: false

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify all workspaces
        run: pnpm run verify

      - name: Verify the Web and MCP contract
        run: pnpm run verify:integration

      - name: Smoke test the stdio server
        run: pnpm run smoke:mcp

      - name: Preview the MCP package boundary
        run: pnpm run pack:mcp
