name: Feature request
description: Propose a compatible capability or architecture change.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem without assuming an implementation.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary boundary
      options:
        - MCP tool contract
        - Local or remote source handling
        - Transport or protocol compatibility
        - Skill or agent integration
        - Workflow orchestration or service boundary
        - Documentation, example, or developer experience
        - Build, performance, packaging, or release
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: State observable acceptance criteria and relevant alternatives.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and risk
      description: Cover tool clients, sources, security, dependencies, state, and rollback where relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Validation evidence
      description: Link specifications or provide tests, measurements, or a minimal example.
