name: Bug report
description: Report a reproducible documentation site or projection defect.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: input
    id: route
    attributes:
      label: Page route or machine document
      placeholder: /zh-cn/getting-started/ or _mcp/getting-started.md
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, runtime, and operating system
      placeholder: Chrome 140; Node.js 22.12; Windows 11
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove credentials, private content, and machine-specific paths.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks already run
      placeholder: Commands, exit codes, screenshots, or relevant output
